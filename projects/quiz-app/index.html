<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quiz-container">
    <div id="quiz-card">
      <div class="quiz-header">
        <span class="quiz-badge">Day 6 Challenge</span>
        <div class="quiz-progress-bar">
          <div id="quiz-progress" style="width: 0%"></div>
        </div>
      </div>
      <h3 id="quiz-question">Loading Question...</h3>
      <div id="quiz-options" class="options-container"></div>
      <div class="quiz-footer">
        <span id="question-tracker">Question 1 of 3</span>
      </div>
    </div>
    <div id="result-card" class="result-card hidden">
      <h3>Quiz Completed!</h3>
      <div class="score-display">
        <span id="score-text">0/0</span>
      </div>
      <p id="feedback-text">Nice try!</p>
      <button class="restart-btn" onclick="restartQuiz()">Try Again</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
