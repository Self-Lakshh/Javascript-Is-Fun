<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bmi-card">
    <h3>Sleek BMI Calculator</h3>
    <div class="slider-group">
      <div class="slider-header">
        <span>Height</span>
        <strong id="height-val">170 cm</strong>
      </div>
      <input type="range" id="bmi-height" min="100" max="220" value="170" oninput="calcBMI()">
    </div>
    <div class="slider-group">
      <div class="slider-header">
        <span>Weight</span>
        <strong id="weight-val">70 kg</strong>
      </div>
      <input type="range" id="bmi-weight" min="30" max="150" value="70" oninput="calcBMI()">
    </div>
    <div class="result-display">
      <div class="gauge-ring">
        <div id="bmi-res" class="bmi-score">24.2</div>
      </div>
      <div id="bmi-label" class="bmi-status normal">Normal Weight</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
