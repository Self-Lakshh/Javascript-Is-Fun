<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator-container">
    <div class="display">
      <div id="calc-expr" class="expression"></div>
      <div id="calc-res" class="result">0</div>
    </div>
    <div class="keypad">
      <button class="btn btn-clear" onclick="press('C')">C</button>
      <button class="btn btn-op" onclick="press('back')">⌫</button>
      <button class="btn btn-op" onclick="press('/')">/</button>
      <button class="btn btn-op" onclick="press('*')">*</button>
      
      <button class="btn" onclick="press('7')">7</button>
      <button class="btn" onclick="press('8')">8</button>
      <button class="btn" onclick="press('9')">9</button>
      <button class="btn btn-op" onclick="press('-')">-</button>
      
      <button class="btn" onclick="press('4')">4</button>
      <button class="btn" onclick="press('5')">5</button>
      <button class="btn" onclick="press('6')">6</button>
      <button class="btn btn-op" onclick="press('+')">+</button>
      
      <button class="btn" onclick="press('1')">1</button>
      <button class="btn" onclick="press('2')">2</button>
      <button class="btn" onclick="press('3')">3</button>
      <button class="btn btn-equal" onclick="press('=')">=</button>
      
      <button class="btn btn-zero" onclick="press('0')">0</button>
      <button class="btn" onclick="press('.')">.</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
