<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card" id="guess-card">
    <h3>Guess the Number</h3>
    <p style="font-size:0.9rem; color:#94a3b8; margin:0 0 10px 0;">Guess a number 1 to 100</p>
    <input type="number" id="guess-input" placeholder="Guess">
    <button onclick="runGuess()" class="btn">Guess</button>
    <div id="guess-res">Start playing!</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
