<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="kanban-wrapper">
    <div class="kanban-header">
      <h3>Kanban Board</h3>
      <div class="add-task-row">
        <input type="text" id="kanban-input" placeholder="New Task Description">
        <button onclick="addTask()">Add</button>
      </div>
    </div>
    <div class="board">
      <div class="column" ondragover="allowDrop(event)" ondrop="drop(event, 'todo')">
        <h4>To Do</h4>
        <div id="col-todo" class="cards-area"></div>
      </div>
      <div class="column" ondragover="allowDrop(event)" ondrop="drop(event, 'progress')">
        <h4>In Progress</h4>
        <div id="col-progress" class="cards-area"></div>
      </div>
      <div class="column" ondragover="allowDrop(event)" ondrop="drop(event, 'done')">
        <h4>Done</h4>
        <div id="col-done" class="cards-area"></div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
